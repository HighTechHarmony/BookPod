<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ channel_title }}</title>
  <style>
    :root {
      --bg: #12141c;
      --panel: #1b1f2b;
      --text: #e8eaf0;
      --muted: #9aa3b5;
      --accent: #7c8cff;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(18, 20, 28, 0.92);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #2a2f3d;
      padding: 14px 24px;
    }
    header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.3px; flex: 1; }
    .refresh {
      padding: 8px 14px;
      border: 1px solid #333a4d;
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .refresh:hover { border-color: var(--accent); }
    .htmx-indicator { opacity: 0; transition: opacity 0.2s; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    main { max-width: 1500px; margin: 0 auto; padding: 24px; }
    .meta { margin: 0 0 18px; font-size: 0.85rem; color: var(--muted); }
    .notice {
      margin: 0 0 18px;
      padding: 10px 14px;
      border: 1px solid #7a4a3a;
      border-radius: 8px;
      background: #2a1d18;
      color: #f0b6a3;
      font-size: 0.85rem;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 64px 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #333a4d;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 22px 18px;
    }
    .card {
      display: flex;
      flex-direction: column;
      text-align: left;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      font: inherit;
      cursor: pointer;
    }
    .card .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: var(--radius);
      background: #232838;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover .thumb { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45); }
    .card .title {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .author { margin-top: 2px; font-size: 0.78rem; color: var(--muted); }
    .placeholder {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      background: #232838;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 36px 0 12px;
    }
    .pagination button {
      min-width: 34px;
      padding: 7px 11px;
      border: 1px solid #333a4d;
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .pagination button:hover:not(:disabled) { border-color: var(--accent); }
    .pagination button.active { background: var(--accent); border-color: var(--accent); color: #0b0d16; font-weight: 600; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination .dots { color: var(--muted); padding: 0 2px; }

    /* Detail drawer */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 30;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(440px, 92vw);
      background: var(--panel);
      border-left: 1px solid #2a2f3d;
      z-index: 40;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-card { display: flex; flex-direction: column; }
    .drawer-close {
      align-self: flex-end;
      margin: 14px 14px 0;
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }
    .drawer-close:hover { color: var(--text); }
    .detail-cover {
      display: block;
      width: 100%;
      max-height: 55vh;
      object-fit: contain;
      object-position: center;
      background: #14161f;
    }
    .drawer-body { padding: 18px 22px 28px; }
    .drawer-body h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .drawer-body .author { margin: 0 0 14px; color: var(--muted); }
    .drawer-body .desc { font-size: 0.92rem; color: #c8cede; }
    .drawer-body .pubdate { font-size: 0.78rem; color: var(--muted); }
    .drawer-body audio { width: 100%; margin: 16px 0 8px; }
    .drawer-body .dl { display: inline-block; color: var(--accent); text-decoration: none; font-size: 0.85rem; }
    .drawer-body .dl:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
  </style>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header>
    <h1>{{ channel_title }}</h1>
    <span id="refresh-ind" class="htmx-indicator">Refreshing…</span>
    <button class="refresh" hx-post="/refresh" hx-target="#grid" hx-swap="innerHTML" hx-indicator="#refresh-ind">
      Refresh feed
    </button>
  </header>

  <main>
    <div id="grid">
      {% if ready %}
        {% include "grid.html" %}
      {% elif error %}
        <div class="notice">Error loading feed: {{ error }}</div>
      {% else %}
        <div class="loading" hx-get="/grid?page=1" hx-trigger="load" hx-target="#grid" hx-swap="innerHTML">
          <span class="spinner" aria-hidden="true"></span>
          Loading audiobooks…
        </div>
      {% endif %}
    </div>
  </main>

  <div id="detail-backdrop" class="backdrop" onclick="closeDrawer()"></div>
  <aside id="detail" class="drawer" aria-label="Book details"></aside>

  <script>
    function closeDrawer() {
      document.getElementById('detail').classList.remove('open');
      document.getElementById('detail-backdrop').classList.remove('show');
    }
    // Whenever a card's detail fragment is swapped into #detail, slide the
    // drawer open. Closing only hides it (content stays in the DOM), so any
    // audio playback in the drawer keeps playing.
    document.body.addEventListener('htmx:afterSwap', function (evt) {
      var target = evt.detail.target;
      if (target && target.id === 'detail') {
        document.getElementById('detail').classList.add('open');
        document.getElementById('detail-backdrop').classList.add('show');
      }
    });
  </script>
</body>
</html>
